name: Nightly scrape + publish to R2

on:
  schedule:
    # Runs daily at 03:17 UTC (pick a non-00 minute to reduce contention)
    - cron: "17 3 * * *"
  workflow_dispatch: {}

jobs:
  scrape-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: Fetch previous job files (fallback for failed sources)
        run: aws s3 sync "s3://${R2_BUCKET}/latest/jobs" previous --endpoint-url "${ENDPOINT}" || true

      - name: Collect prices
        run: |
          python -m scraper.run_all --out-dir data --raw-dir raw --previous-dir previous
          python -m scraper.merge --data-dir data

      - name: Upload to Cloudflare R2 (S3 API)
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          # "latest" is overwritten each run; the dated snapshot is kept for history charts
          aws s3 sync data "s3://${R2_BUCKET}/latest" --endpoint-url "${ENDPOINT}" --delete
          aws s3 sync data "s3://${R2_BUCKET}/history/${DATE}" --endpoint-url "${ENDPOINT}"
          # Raw upstream responses and quarantined rows, for diagnosing failures
          aws s3 sync raw "s3://${R2_BUCKET}/raw/${DATE}" --endpoint-url "${ENDPOINT}"
